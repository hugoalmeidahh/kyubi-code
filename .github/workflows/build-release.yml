name: Build Kyubi Code (macOS / Linux / Windows)

on:
  workflow_dispatch:
    inputs:
      quality:
        description: Build quality
        type: choice
        default: stable
        options: [stable, insider]
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            gulp_task: vscode-darwin-arm64-min
            output_dir: VSCode-darwin-arm64
            npm_arch: arm64
          - platform: darwin-x64
            os: macos-13
            gulp_task: vscode-darwin-x64-min
            output_dir: VSCode-darwin-x64
            npm_arch: x64
          - platform: linux-x64
            os: ubuntu-24.04
            gulp_task: vscode-linux-x64-min
            output_dir: VSCode-linux-x64
            npm_arch: x64
          - platform: win32-x64
            os: windows-2022
            gulp_task: vscode-win32-x64-min
            output_dir: VSCode-win32-x64
            npm_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NPM_ARCH: ${{ matrix.npm_arch }}
      VSCODE_ARCH: ${{ matrix.npm_arch }}
      # Skip husky/git hooks and telemetry noise in CI
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev rpm fakeroot

      - name: Install dependencies
        run: npm ci
        env:
          # native module rebuilds
          npm_config_arch: ${{ matrix.npm_arch }}

      - name: Build (minified)
        run: npm run gulp ${{ matrix.gulp_task }}

      - name: Package Linux .deb
        if: matrix.platform == 'linux-x64'
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb

      - name: Archive build (macOS)
        if: startsWith(matrix.platform, 'darwin')
        run: |
          cd ..
          zip -r -y kyubi-code-${{ matrix.platform }}.zip ${{ matrix.output_dir }}
          mv kyubi-code-${{ matrix.platform }}.zip $GITHUB_WORKSPACE/

      - name: Archive build (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          cd ..
          tar -czf kyubi-code-${{ matrix.platform }}.tar.gz ${{ matrix.output_dir }}
          mv kyubi-code-${{ matrix.platform }}.tar.gz $GITHUB_WORKSPACE/
          if ls .build/linux/deb/**/*.deb 1>/dev/null 2>&1; then cp .build/linux/deb/**/*.deb $GITHUB_WORKSPACE/ || true; fi

      - name: Archive build (Windows)
        if: startsWith(matrix.platform, 'win32')
        shell: pwsh
        run: |
          Compress-Archive -Path "..\${{ matrix.output_dir }}" -DestinationPath "kyubi-code-${{ matrix.platform }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyubi-code-${{ matrix.platform }}
          path: |
            kyubi-code-${{ matrix.platform }}.*
            *.deb
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
